apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudvault-frontend
  namespace: cloudvault
  labels:
    app.kubernetes.io/name: cloudvault-frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: cloudvault-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudvault-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudvault-frontend
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: cloudvault-frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

