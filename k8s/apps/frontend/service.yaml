apiVersion: v1
kind: Service
metadata:
  name: cloudvault-frontend
  namespace: cloudvault
  labels:
    app.kubernetes.io/name: cloudvault-frontend
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: cloudvault-platform
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloudvault-frontend
