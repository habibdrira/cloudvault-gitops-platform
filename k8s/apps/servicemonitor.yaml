apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudvault-backend
  namespace: cloudvault
  labels:
    app.kubernetes.io/name: cloudvault-backend
    app.kubernetes.io/part-of: cloudvault-platform
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudvault-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
