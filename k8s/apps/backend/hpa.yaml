apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudvault-backend-hpa
  namespace: cloudvault
  labels:
    app.kubernetes.io/name: cloudvault-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudvault-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudvault-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
