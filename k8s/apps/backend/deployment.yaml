apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudvault-backend
  namespace: cloudvault
  labels:
    app.kubernetes.io/name: cloudvault-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudvault-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudvault-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudvault-backend
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: backend
          image: cloudvault-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: AWS_ENDPOINT_URL
              value: "http://192.168.100.10:4566"
            - name: AWS_REGION
              value: "us-east-1"
            - name: S3_BUCKET
              value: "cloudvault-documents"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

