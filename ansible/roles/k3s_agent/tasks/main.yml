# ============================================================================
# Rôle : k3s_agent — Rattachement du Worker au Control Plane K3s
# ============================================================================
# Justification architecturale :
#   Ce rôle installe K3s en mode "agent" et le rattache dynamiquement au
#   Control Plane via le node-token extrait par le rôle k3s_server.
#
#   Le rattachement utilise :
#   - K3S_URL     → https://<master_ip>:6443 (résolu depuis group_vars)
#   - K3S_TOKEN   → extrait dynamiquement via hostvars du master
#   - flannel_iface → même interface réseau que le server (ens33)
#
#   Prérequis : le rôle k3s_server DOIT avoir été exécuté avant celui-ci
#   dans site.yml afin que le fact k3s_token soit disponible.
# ============================================================================

---
# -- 1. Vérification d'idempotence --------------------------------------------

- name: "k3s_agent | Vérifier si K3s agent est déjà installé"
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary

# -- 2. Installation K3s Agent ------------------------------------------------

- name: "k3s_agent | Télécharger le script d'installation K3s"
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_agent_binary.stat.exists

- name: "k3s_agent | Installer K3s Agent et rattacher au Control Plane"
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN: "{{ hostvars[groups['k8s_master'][0]]['k3s_token'] }}"
    INSTALL_K3S_EXEC: >-
      agent
      --flannel-iface={{ flannel_iface }}
      --node-ip={{ ansible_host }}
  when: not k3s_agent_binary.stat.exists
  notify: Restart k3s-agent

# -- 3. Service K3s Agent -----------------------------------------------------

- name: "k3s_agent | Activer et démarrer le service K3s Agent"
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
    daemon_reload: true

# -- 4. Validation du rattachement -------------------------------------------

- name: "k3s_agent | Valider que le worker apparaît dans le cluster"
  ansible.builtin.command: >-
    /usr/local/bin/k3s kubectl get node {{ inventory_hostname }}
  delegate_to: "{{ groups['k8s_master'][0] }}"
  register: agent_joined
  until: agent_joined.rc == 0
  retries: 20
  delay: 10
  changed_when: false

