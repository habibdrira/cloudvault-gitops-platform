name: CloudVault CI / CD & Quality Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend Go CI (Clean Arch & Unit Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Go Syntax & Vet Analysis
        run: go vet ./...

      - name: Static Code Analysis (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: apps/backend
          args: --timeout=5m

      - name: Run Unit Tests with Race Detector & Coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Display Test Coverage Summary
        run: go tool cover -func=coverage.out

  frontend-ci:
    name: Frontend Next.js CI (Lint & TypeCheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Types
        run: npx tsc --noEmit

      - name: Validate Next.js Linting
        run: npm run lint || true

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  iac-k8s-ci:
    name: Infrastructure & Kubernetes Manifests Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Validate Terraform Formatting
        working-directory: infra-services/terraform
        run: terraform fmt -check

      - name: Initialize & Validate Terraform Configuration
        working-directory: infra-services/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate Kubernetes Manifests Syntax
        run: python3 tests/validate_k8s_yaml.py

  devsecops-scan:
    name: DevSecOps Vulnerability & Secret Scanning (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Local Backend Docker Image
        run: docker build -t cloudvault-backend:latest apps/backend

      - name: Build Local Frontend Docker Image
        run: docker build -t cloudvault-frontend:latest apps/frontend

      - name: Scan Codebase for Secrets
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scanners: 'secret'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan IaC & Kubernetes Misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Scan Backend Docker Image for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudvault-backend:latest'
          scan-type: 'image'
          severity: 'CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Scan Frontend Docker Image for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloudvault-frontend:latest'
          scan-type: 'image'
          severity: 'CRITICAL'
          exit-code: '1'
          trivyignores: '.trivyignore'
